      - delete:
          url: "/products/{{ productId }}"
          headers:
            Authorization: ""
          expect:
            - statusCode: 401
            - hasHeader: "Content-Type"
            - headerEquals: ["Content-Type", "application/json"]
      - think: 1

      - log: "Deleting a product with expired token"
      - delete:
          url: "/products/{{ productId }}"
          headers:
            Authorization: "Bearer expired_token"
          expect:
            - statusCode: 403
            - hasHeader: "Content-Type"
            - headerEquals: ["Content-Type", "application/json"]
      - think: 1

      - log: "Deleting a product with invalid url"
      - delete:
          url: "/invalid_url/{{ productId }}"
          headers:
            Authorization: "Bearer {{$processEnvironment.nnnn_AUTH_TOKEN}}"
