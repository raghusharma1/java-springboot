      - delete:
          url: "/products/{{ productId }}"
          headers:
            Authorization: "Bearer invalid_token"
          expect:
            - statusCode: 401
            - hasProperty: "message"
            - equals: ["message", "Unauthorized"]
      - think: 1

      - log: "Attempting to delete a product with a non-existent endpoint"
      - delete:
          url: "/nonexistent/{{ productId }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.nnnn_AUTH_TOKEN }}"
          expect:
            - statusCode: 404
      - think: 1
