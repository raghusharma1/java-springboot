config:
  target: "{{ $processEnvironment.nnnn_API_HOST }}"
  plugins:
    expect: {}
  payload:
    path: "products_productId_delete_others.csv"
    fields: ["productId"]
    skipHeader: true
    delimiter: "^|^"
  phases:
    - duration: 60
      arrivalRate: 5
  environments:
    dev:
      target: "http://dev.api.com"
      headers:
        Authorization: "Bearer {{$processEnvironment.nnnn_AUTH_TOKEN}}"
    prod:
      target: "http://prod.api.com"
      headers:
        Authorization: "Bearer {{$processEnvironment.nnnn_AUTH_TOKEN}}"

scenarios:
  - name: "Testing non-successful API responses"
    flow:
      - log: "Attempting to delete a product with an invalid id"
      - delete:
          url: "/products/{{ productId }}"
          expect:
            - statusCode: 404
            - hasProperty: "error"
            - equals: ["message", "Product not found"]
          headers:
            Authorization: "Bearer {{$processEnvironment.nnnn_AUTH_TOKEN}}"
      - think: 2

      - log: "Attempting to delete a product without authorization"
      - delete:
          url: "/products/{{ productId }}"
          expect:
            - statusCode: 401
            - hasProperty: "error"
            - equals: ["message", "Unauthorized"]
      - think: 2

      - log: "Attempting to delete a product with an incorrect URL"
      - delete:
          url: "/invalidUrl/{{ productId }}"
          expect:
            - statusCode: 404
            - hasProperty: "error"
            - equals: ["message", "Not Found"]
          headers:
            Authorization: "Bearer {{$processEnvironment.nnnn_AUTH_TOKEN}}"
      - think: 2
