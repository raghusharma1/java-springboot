config:
  target: "{{ $processEnvironment.nnnn_API_HOST }}"
  plugins:
    expect: {}
  payload:
    path: "products_productId_delete_others.csv"
    fields: ["productId"]
    skipHeader: true
    delimiter: "^|^"
  phases:
    - duration: 60
      arrivalRate: 5

scenarios:
  - name: "Test non-successful API responses"
    flow:
      - log: "Deleting a product with invalid id"
      - delete:
          url: "/products/{{ productId }}"
          headers:
            Authorization: "Bearer {{$processEnvironment.nnnn_AUTH_TOKEN}}"
          expect:
            - statusCode: 404
            - hasProperty: "error"
            - equals:
                - "error"
                - "Product not found"
      - think: 1

      - log: "Deleting a product without authorization token"
      - delete:
          url: "/products/{{ productId }}"
          headers:
            Authorization: ""
          expect:
            - statusCode: 401
            - hasProperty: "error"
            - equals:
                - "error"
                - "Unauthorized"
      - think: 1

      - log: "Deleting a product with invalid URL"
      - delete:
          url: "/invalidURL/{{ productId }}"
          headers:
            Authorization: "Bearer {{$processEnvironment.nnnn_AUTH_TOKEN}}"
          expect:
            - statusCode: 404
      - think: 1
