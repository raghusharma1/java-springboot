scenarios:
  - name: "Update product with invalid data"
    flow:
      - log: "Attempting to update product with invalid ID"
      - put:
          url: "/products/{{ id }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.nnnn_AUTH_TOKEN }}"
          json:
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
      - expect:
            - statusCode: 400
            - hasProperty: "error"
      - think: 2

      - log: "Attempting to update product without a name"
      - put:
          url: "/products/{{ id }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.nnnn_AUTH_TOKEN }}"
          json:
            description: "{{ description }}"
            price: "{{ price }}"
      - expect:
            - statusCode: 400
            - hasProperty: "error"
      - think: 2

      - log: "Attempting to update product with invalid auth token"
      - put:
          url: "/products/{{ id }}"
          headers:
            Authorization: "Bearer invalid-token"
          json:
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
      - expect:
            - statusCode: 401
            - hasProperty: "error"
      - think: 2
