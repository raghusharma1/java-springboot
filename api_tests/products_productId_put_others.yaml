config:
  target: "{{ $processEnvironment.nnnn_API_HOST }}"
  plugins:
    expect: {}
  payload:
    path: "products_productId_put_others.csv"
    fields:
      - "id"
      - "name"
      - "description"
      - "price"
    skipHeader: true
    delimiter: "^|^"
  environments:
    dev:
      target: "http://dev.api.host"
      auth_token: "devtoken"
    prod:
      target: "http://prod.api.host"
      auth_token: "prodtoken"

scenarios:
  - name: "Non-Success API Responses"
    flow:
      - log: "Sending a PUT request to /products/{productId} with incorrect payload"
      - put:
          url: "/products/{{ id }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.nnnn_AUTH_TOKEN }}"
          json:
            id: "{{ id }}"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          expect:
            - statusCode: 400
            - hasProperty: "error"
            - equals:
                - "error.message"
                - "Invalid request payload input"
      - think: 1

      - log: "Sending a PUT request to /products/{productId} with incorrect auth token"
      - put:
          url: "/products/{{ id }}"
          headers:
            Authorization: "Bearer invalid_token"
          json:
            id: "{{ id }}"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          expect:
            - statusCode: 401
            - hasProperty: "message"
            - equals:
                - "message"
                - "Unauthorized"
      - think: 1

      - log: "Sending a PUT request to an invalid URL"
      - put:
          url: "/invalid_url/{{ id }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.nnnn_AUTH_TOKEN }}"
          json:
            id: "{{ id }}"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          expect:
            - statusCode: 404
            - hasProperty: "message"
            - equals:
                - "message"
                - "Not Found"
      - think: 1
