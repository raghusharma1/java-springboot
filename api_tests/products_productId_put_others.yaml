config:
  target: "{{ $processEnvironment.nnnn_API_HOST }}"
  plugins:
    expect: {}
  payload:
    path: "products_productId_put_others.csv"
    fields:
      - "id"
      - "name"
      - "description"
      - "price"
    skipHeader: true
    delimiter: "^|^"
  environments:
    dev:
      target: "http://dev.api.host"
      auth_token: "devtoken"
    prod:
      target: "http://prod.api.host"
      auth_token: "prodtoken"

scenarios:
  - name: "Non-Success API Responses"
    flow:
      - log: "Sending a PUT request to /products with invalid payload"
      - put:
          url: "/products/{{ id }}"
          headers:
            Authorization: "Bearer {{$processEnvironment.nnnn_AUTH_TOKEN}}"
          json:
            id: "{{ id }}"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          expect:
            - statusCode: 400
            - hasProperty: "error"
            - equals: 
                error: "Invalid payload"
      - think: 1

      - log: "Sending a PUT request to /products without authorization header"
      - put:
          url: "/products/{{ id }}"
          json:
            id: "{{ id }}"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          expect:
            - statusCode: 401
            - hasProperty: "error"
            - equals: 
                error: "Authorization header missing"
      - think: 1

      - log: "Sending a PUT request to an incorrect URL"
      - put:
          url: "/product/{{ id }}"
          headers:
            Authorization: "Bearer {{$processEnvironment.nnnn_AUTH_TOKEN}}"
          json:
            id: "{{ id }}"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          expect:
            - statusCode: 404
      - think: 1
