config:
  target: "{{ $processEnvironment.nnnn_API_HOST }}"
  plugins:
    expect: {}
  payload:
    path: "products_productId_put_others.csv"
    fields: ["productId", "name", "description", "price"]
    skipHeader: true
    delimiter: "^|^"
  environments:
    dev:
      target: "{{ $processEnvironment.nnnn_API_HOST }}"
      http:
        timeout: 10
        rejectUnauthorized: false
        headers:
          Authorization: "Bearer {{$processEnvironment.nnnn_AUTH_TOKEN}}"

scenarios:
  - name: "Test non-success API responses"
    flow:
      - log: "Updating a product with invalid payload"
      - put:
          url: "/products/{{ productId }}"
          headers:
            Content-Type: "application/json"
            Authorization: "Bearer {{$processEnvironment.nnnn_AUTH_TOKEN}}"
          json:
            id: "{{ productId }}"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          expect:
            - statusCode: 400
      - think: 1

      - log: "Updating a product with invalid authentication"
      - put:
          url: "/products/{{ productId }}"
          headers:
            Content-Type: "application/json"
            Authorization: "InvalidToken"
          json:
            id: "{{ productId }}"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          expect:
            - statusCode: 401
      - think: 1

      - log: "Updating a non-existing product"
      - put:
          url: "/products/999999999999999999999"
          headers:
            Content-Type: "application/json"
            Authorization: "Bearer {{$processEnvironment.nnnn_AUTH_TOKEN}}"
          json:
            id: "999999999999999999999"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          expect:
            - statusCode: 404
      - think: 1
