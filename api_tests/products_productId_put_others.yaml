config:
  target: "{{ $processEnvironment.nnnn_API_HOST }}"
  plugins:
    expect: {}
  payload:
    path: "products_productId_put_others.csv"
    fields: 
      - "productId"
      - "name"
      - "description"
      - "price"
    skipHeader: true
    delimiter: "^|^"
  defaults:
    headers:
      Authorization: "Bearer {{ $processEnvironment.nnnn_AUTH_TOKEN }}"

scenarios:
  - name: "Non-success API responses"
    flow:
      - log: "Testing PUT /products/{productId} with invalid data"
      - put:
          url: "/products/{{ productId }}"
          headers:
            Content-Type: "application/json"
          json:
            id: "{{ productId }}"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
      - expect:
            - statusCode: 400
            - hasProperty: "message"
            - notHasProperty: "result"
      - think: 1

      - log: "Testing PUT /products/{productId} with no authorization"
      - put:
          url: "/products/{{ productId }}"
          headers:
            Content-Type: "application/json"
            Authorization: ""
          json:
            id: "{{ productId }}"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
      - expect:
            - statusCode: 401
            - hasProperty: "message"
            - notHasProperty: "result"
      - think: 1

      - log: "Testing PUT /products/{productId} with incorrect authorization"
      - put:
          url: "/products/{{ productId }}"
          headers:
            Content-Type: "application/json"
            Authorization: "Bearer incorrect_token"
          json:
