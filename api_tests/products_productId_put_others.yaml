config:
  target: "{{ $processEnvironment.nnnn_API_HOST }}"
  plugins:
    expect: {}
  payload:
    path: "products_productId_put_others.csv"
    fields: 
      - "productId"
      - "name"
      - "description"
      - "price"
    skipHeader: true
    delimiter: "^|^"
  defaults:
    headers:
      Authorization: "Bearer {{ $processEnvironment.nnnn_AUTH_TOKEN }}"

scenarios:
  - name: "Non-success API responses"
    flow:
      - log: "Sending invalid PUT request to /products/{productId}"
      - put:
          url: "/products/{{ productId }}"
          json:
            id: "{{ productId }}"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          expect:
            - statusCode: 400
            - hasProperty: "message"
      - think: 1

      - log: "Sending PUT request to invalid URL"
      - put:
          url: "/invalid/products/{{ productId }}"
          json:
            id: "{{ productId }}"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          expect:
            - statusCode: 404
      - think: 1

      - log: "Sending PUT request without authentication"
      - put:
          url: "/products/{{ productId }}"
          headers:
            Authorization: ""
          json:
            id: "{{ productId }}"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          expect:
            - statusCode: 401
      - think: 1

      - log: "Sending PUT request with invalid payload"
      - put:
          url: "/products/{{ productId }}"
          json:
            id: "invalid"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          expect:
            - statusCode: 400
      - think: 1
