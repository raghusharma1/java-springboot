config:
  target: "{{ $processEnvironment.nnnn_API_HOST }}"
  plugins:
    expect: {}
  payload:
    path: "products_productId_put_others.csv"
    fields: 
      - "productId"
      - "name"
      - "description"
      - "price"
    skipHeader: true
    delimiter: "^|^"
  defaults:
    headers:
      {{ SECURITY_SCHEMA.name }}: "{{ $processEnvironment.nnnn_AUTH_TOKEN }}"

scenarios:
  - name: "Test non-successful API responses"
    flow:
      - log: "Requesting with invalid product id"
      - put:
          url: "/products/{{ productId }}"
          headers:
            Content-Type: "application/json"
          json:
            id: "{{ id }}"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          expect:
            - statusCode: 404
            - hasProperty: "message"
            - equals: ["message", "Product not found"]
      - think: 1

      - log: "Requesting with missing name field in payload"
      - put:
          url: "/products/{{ productId }}"
          headers:
            Content-Type: "application/json"
          json:
            id: "{{ id }}"
            description: "{{ description }}"
            price: "{{ price }}"
          expect:
            - statusCode: 400
            - hasProperty: "message"
            - equals: ["message", "Name field is required"]
      - think: 1

      - log: "Requesting with invalid authorization token"
      - put:
          url: "/products/{{ productId }}"
          headers:
            Content-Type: "application/json"
            {{ SECURITY_SCHEMA.name }}: "invalid_token"
          json:
            id: "{{ id }}"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          expect:
            - statusCode: 401
            - hasProperty: "message"
            - equals: ["message", "Authorization failed"]
      - think: 1
