config:
  target: "{{ $processEnvironment.nnnn_API_HOST }}"
  plugins:
    expect: {}
  payload:
    path: "products_productId_put_others.csv"
    fields:
      - "id"
      - "name"
      - "description"
      - "price"
    skipHeader: true
    delimiter: "^|^"
  environments:
    dev:
      target: "http://dev.api.host"
      $processEnvironment:
        AUTH_TOKEN: "dev-auth-token"
    prod:
      target: "http://prod.api.host"
      $processEnvironment:
        AUTH_TOKEN: "prod-auth-token"

scenarios:
  - name: "Non-Success API Responses Scenario"
    flow:
      - log: "Attempting to update a product with invalid id"
      - put:
          url: "/products/{{ id }}"
          headers:
            Content-Type: "application/json"
            Authorization: "Bearer {{$processEnvironment.nnnn_AUTH_TOKEN}}"
          json:
            id: "{{ id }}"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          expect:
            - statusCode: 404
            - hasProperty: "error"
            - equals:
                error: "Product not found"
      - think: 1

      - log: "Attempting to update a product without required name field"
      - put:
          url: "/products/{{ id }}"
          headers:
            Content-Type: "application/json"
            Authorization: "Bearer {{$processEnvironment.nnnn_AUTH_TOKEN}}"
          json:
            id: "{{ id }}"
            description: "{{ description }}"
            price: "{{ price }}"
          expect:
            - statusCode: 400
            - hasProperty: "error"
            - equals:
                error: "Name field is required"
      - think: 1

      - log: "Attempting to update a product with invalid auth token"
      - put:
          url: "/products/{{ id }}"
          headers:
            Content-Type: "application/json"
            Authorization: "Bearer invalid-token"
          json:
            id: "{{ id }}"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          expect:
            - statusCode: 401
            - hasProperty: "error"
            - equals:
                error: "Invalid auth token"
      - think: 1
