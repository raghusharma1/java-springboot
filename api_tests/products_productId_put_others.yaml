scenarios:
  - name: "Update product with invalid data"
    flow:
      - log: "Sending invalid product update request"
      - put:
          url: "/products/{{ id }}"
          headers:
            Authorization: "Bearer {{$processEnvironment.nnnn_AUTH_TOKEN}}"
            Content-Type: "application/json"
          json:
            id: "{{ id }}"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          expect:
            - statusCode: 400
      - think: 1

      - log: "Sending product update request with missing auth token"
      - put:
          url: "/products/{{ id }}"
          headers:
            Authorization: ""
            Content-Type: "application/json"
          json:
            id: "{{ id }}"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          expect:
            - statusCode: 401
      - think: 1

      - log: "Sending product update request to non-existing product"
      - put:
          url: "/products/9999"
          headers:
            Authorization: "Bearer {{$processEnvironment.nnnn_AUTH_TOKEN}}"
            Content-Type: "application/json"
          json:
            id: 9999
            name: "Non-existing product"
            description: "This product does not exist"
            price: 100
          expect:
            - statusCode: 404
