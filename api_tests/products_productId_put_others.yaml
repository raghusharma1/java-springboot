config:
  target: "{{ $processEnvironment.API_HOST }}"
  plugins:
    expect: {}
  payload:
    path: "products_productId_put_others.csv"
    fields:
      - "id"
      - "name"
      - "description"
      - "price"
    skipHeader: true
    delimiter: "^|^"
  environments:
    dev:
      target: "http://dev.api.host"
      variables:
        AUTH_TOKEN: "DEV_AUTH_TOKEN"

scenarios:
  - name: "Testing non-success API responses"
    flow:
      - log: "Starting scenario for non-success API responses"
      - put: # PUT request with valid data but expecting status 400
          url: "/products/{{ id }}"
          json:
            id: "{{ id }}"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 400
            - hasProperty: "error"
            - equals:
                error: "Invalid request"
      - think: 1
      - put: # PUT request with invalid id
          url: "/products/invalid_id"
          json:
            id: "{{ id }}"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 404
            - hasProperty: "error"
            - equals:
                error: "Product not found"
      - think: 1
      - put: # PUT request with invalid authorization token
          url: "/products/{{ id }}"
          json:
            id: "{{ id }}"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          headers:
            Authorization: "Invalid_Token"
          expect:
            - statusCode: 401
            - hasProperty: "error"
            - equals:
                error: "Unauthorized"
      - think: 1
