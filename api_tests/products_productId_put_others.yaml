config:
  target: "{{ $processEnvironment.nnnn_API_HOST }}"
  plugins:
    expect: {}
  payload:
    path: "products_productId_put_others.csv"
    fields: ["productId", "name", "description", "price"]
    skipHeader: true
    delimiter: "^|^"
  environments:
    dev:
      target: "{{ $processEnvironment.nnnn_API_HOST }}"
      http:
        timeout: 10
        rejectUnauthorized: false
        headers:
          Authorization: "Bearer {{$processEnvironment.nnnn_AUTH_TOKEN}}"

scenarios:
  - name: "Test non-success API responses"
    flow:
      - log: "Updating a product with invalid payload"
      - put:
          url: "/products/{{ productId }}"
          json:
            id: "{{ productId }}"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          expect:
            - statusCode: 400
            - hasProperty: "message"
            - equals: 
                message: "Invalid payload"
      - think: 1

      - log: "Updating a product without authorization"
      - put:
          url: "/products/{{ productId }}"
          headers:
            Authorization: "Bearer invalid_token"
          json:
            id: "{{ productId }}"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          expect:
            - statusCode: 401
            - hasProperty: "message"
            - equals: 
                message: "Unauthorized"
      - think: 1

      - log: "Updating a product that does not exist"
      - put:
          url: "/products/99999"
          json:
            id: 99999
            name: "Non existent product"
            description: "This product does not exist"
            price: 99999
          expect:
            - statusCode: 404
            - hasProperty: "message"
            - equals: 
                message: "Product not found"
      - think: 1
