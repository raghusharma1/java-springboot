config:
  target: "{{ $processEnvironment.nnnn_API_HOST }}"
  plugins:
    expect: {}
  payload:
    path: "products_productId_put_others.csv"
    fields: 
      - "productId"
      - "name"
      - "description"
      - "price"
    skipHeader: true
    delimiter: "^|^"
  defaults:
    headers:
      Authorization: "Bearer {{ $processEnvironment.nnnn_AUTH_TOKEN }}"

scenarios:
  - name: "Non-success API responses"
    flow:
      - log: "Sending PUT request with invalid product id"
      - put:
          url: "/products/{{ productId }}"
          json:
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
      - expect:
            - statusCode: 404
            - hasProperty: "message"
            - equals: 
                message: "Product not found"
      - think: 1

      - log: "Sending PUT request without required field 'name'"
      - put:
          url: "/products/{{ productId }}"
          json:
            description: "{{ description }}"
            price: "{{ price }}"
      - expect:
            - statusCode: 400
            - hasProperty: "message"
            - equals: 
                message: "The 'name' field is required"
      - think: 1

      - log: "Sending PUT request with invalid token"
      - put:
          url: "/products/{{ productId }}"
          json:
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          headers:
            Authorization: "Bearer InvalidToken"
      - expect:
            - statusCode: 401
            - hasProperty: "message"
            - equals: 
                message: "Invalid token"
      - think: 1
