config:
  target: "{{ $processEnvironment.nnnn_API_HOST }}"
  plugins:
    expect: {}
  payload:
    path: "products_get_others.csv"
    fields: ["id", "name"]
    skipHeader: true
    delimiter: "^|^"
  environments:
    dev:
      target: "{{ $processEnvironment.nnnn_API_HOST }}"
      http:
        timeout: 10

scenarios:
  - name: "Test non-successful API responses"
    flow:
      - log: "Starting Scenario: Test non-successful API responses"
      - think: 1
      - get:
          url: "/products?name={{ name }}"
          headers:
            Authorization: "Bearer {{$processEnvironment.nnnn_AUTH_TOKEN}}"
          expect:
            - statusCode: 404
            - hasProperty: "error"
      - think: 1
      - log: "Requesting a product with an invalid id"
      - get:
          url: "/products/{{ id }}"
          headers:
            Authorization: "Bearer {{$processEnvironment.nnnn_AUTH_TOKEN}}"
          expect:
            - statusCode: 400
            - hasProperty: "error"
            - equals:
                error: "Invalid product id"
      - think: 1
      - log: "Requesting a product with an id that doesn't exist"
      - get:
          url: "/products/{{ id }}"
          headers:
            Authorization: "Bearer {{$processEnvironment.nnnn_AUTH_TOKEN}}"
          expect:
            - statusCode: 404
            - hasProperty: "error"
            - equals:
                error: "Product not found"
      - think: 1
