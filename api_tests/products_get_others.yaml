    path: "products_get_others.csv"
    fields: ["id", "name"]
    skipHeader: true
    delimiter: "^|^"
  environments:
    dev:
      target: "{{ $processEnvironment.nnnn_API_HOST }}"
      http:
        timeout: 10

scenarios:
  - name: "Test scenario for various non-success API requests"
    flow:
      - log: "Sending a GET request with an invalid URL"
      - get:
          url: "/invalid_url"
          headers:
            Authorization: "Bearer {{$processEnvironment.nnnn_AUTH_TOKEN}}"
          expect:
            - statusCode: 404

      - think: 1

