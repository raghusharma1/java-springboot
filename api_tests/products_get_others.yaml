      - get:
          url: "/products/{{ id }}"
          headers:
            Authorization: "Bearer {{$processEnvironment.nnnn_AUTH_TOKEN}}"
          expect:
            - statusCode: 404
            - hasProperty: "error"
            - equals:
                error: "Product not found"

      - think: 1

      - log: "Sending a POST request with an invalid payload"
      - post:
          url: "/products"
          headers:
            Authorization: "Bearer {{$processEnvironment.nnnn_AUTH_TOKEN}}"
