scenarios:
  - name: Non-Success API Responses Scenario
    flow:
      - log: "Executing GET request to an invalid URL"
      - get:
          url: "/invalid"
          expect:
            - statusCode: 404
      - think: 1

      - log: "Executing GET request without token"
      - get:
          url: "/products"
          headers:
            Authorization: "InvalidToken"
          expect:
            - statusCode: 401
      - think: 1

      - log: "Executing GET request with invalid product id"
      - get:
          url: "/products/{{ id }}"
          headers:
            Authorization: "{{ $processEnvironment.nnnn_AUTH_TOKEN }}"
          expect:
            - statusCode: 404
      - think: 1

      - log: "Executing GET request with valid token but invalid endpoint"
      - get:
          url: "/invalid/{{ name }}"
          headers:
            Authorization: "{{ $processEnvironment.nnnn_AUTH_TOKEN }}"
          expect:
            - statusCode: 404
      - think: 1
