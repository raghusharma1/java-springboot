config:
  target: "{{ $processEnvironment.nnnn_API_HOST }}"
  plugins:
    expect: {}
  payload:
    path: "products_get_others.csv"
    fields: ["id", "name"]
    skipHeader: true
    delimiter: "^|^"
  environments:
    dev:
      target: "{{ $processEnvironment.nnnn_API_HOST }}"
      http:
        timeout: 10

scenarios:
  - name: "Test non-successful API responses"
    flow:
      - log: "Starting Scenario: Test non-successful API responses"
      - get:
          url: "/products/{{ id }}"
          headers:
            Authorization: "Bearer {{$processEnvironment.nnnn_AUTH_TOKEN}}"
          expect:
            - statusCode: 404
            - hasProperty: "error"
            - equals: 
                - "error.message": "Product not found"
      - think: 1
      - log: "Completed GET request"
      
      - post:
          url: "/products"
          json:
            name: "{{ name }}"
          headers:
            Authorization: "Bearer {{$processEnvironment.nnnn_AUTH_TOKEN}}"
          expect:
            - statusCode: 400
            - hasProperty: "error"
            - equals: 
                - "error.message": "Invalid product name"
      - think: 1
      - log: "Completed POST request"

      - delete:
          url: "/products/{{ id }}"
          headers:
            Authorization: "Bearer {{$processEnvironment.nnnn_AUTH_TOKEN}}"
          expect:
            - statusCode: 403
            - hasProperty: "error"
            - equals: 
                - "error.message": "Unauthorized"
      - think: 1
      - log: "Completed DELETE request"

      - put:
          url: "/products/{{ id }}"
          json:
            name: "{{ name }}"
          headers:
            Authorization: "Bearer {{$processEnvironment.nnnn_AUTH_TOKEN}}"
          expect:
            - statusCode: 405
            - hasProperty: "error"
            - equals: 
                - "error.message": "Method not allowed"
      - think: 1
      - log: "Completed PUT request"
      
      - log: "Ending Scenario: Test non-successful API responses"
