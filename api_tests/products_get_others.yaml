config:
  target: "{{ $processEnvironment.nnnn_API_HOST }}"
  plugins:
    expect: {}
  payload:
    path: "products_get_others.csv"
    fields: ["id", "name"]
    skipHeader: true
    delimiter: "^|^"
  environments:
    dev:
      target: "{{ $processEnvironment.nnnn_API_HOST }}"
      http:
        pool: 10
    prod:
      target: "{{ $processEnvironment.nnnn_API_HOST }}"
      http:
        pool: 20
  phases:
    - duration: 60
      arrivalRate: 5
      name: Warm up the application
    - duration: 120
      arrivalRate: 5
      rampTo: 50
      name: Ramp up load
    - duration: 600
