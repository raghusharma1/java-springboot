config:
  target: "{{ processEnvironment.nnnn_API_HOST }}"
  plugins:
    expect: {}
  payload:
    path: "products_post_others.csv"
    fields: ["id", "name", "description", "price"]
    skipHeader: true
    delimiter: "^|^"
  environments:
    dev:
      target: "{{ processEnvironment.nnnn_API_HOST }}"
      http:
        pool: 10

scenarios:
  - name: "Non-Success API Responses"
    flow:
      - log: "Attempt to add a new product with incorrect payload"
      - post:
          url: "/products"
          json:
            id: "{{ id }}"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          headers:
            Content-Type: "application/json"
            Authorization: "Bearer {{ processEnvironment.nnnn_AUTH_TOKEN }}"
          expect:
            - statusCode: 400
            - hasProperty: "error"
            - equals: ["message", "Invalid payload"]
      - think: 1

      - log: "Attempt to add a new product without authentication"
      - post:
          url: "/products"
          json:
            id: "{{ id }}"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          headers:
            Content-Type: "application/json"
          expect:
            - statusCode: 401
            - hasProperty: "error"
            - equals: ["message", "Unauthorized"]
      - think: 1

      - log: "Attempt to add a new product to a non-existing URL"
      - post:
          url: "/non_existing_url"
          json:
            id: "{{ id }}"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          headers:
            Content-Type: "application/json"
            Authorization: "Bearer {{ processEnvironment.nnnn_AUTH_TOKEN }}"
