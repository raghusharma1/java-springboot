    path: "products_post_others.csv"
    fields: ["id", "name", "description", "price"]
    skipHeader: true
    delimiter: "^|^"
  environments:
    dev:
      target: "{{ $processEnvironment.nnnn_API_HOST }}"
      http:
        pool: 10

scenarios:
  - name: "Product API Failure Cases"
    flow:
      - log: "Testing an invalid URL"
