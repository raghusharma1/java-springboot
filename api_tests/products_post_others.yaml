            name: "{{ name }}"
            description: "{{ description }}"
            price: "invalid"
          headers:
            Authorization: "Bearer {{ $processEnvironment.nnnn_AUTH_TOKEN }}"
          expect: 
            - statusCode: 400
            - hasProperty: "error"
      - think: 1
      - log: "Testing POST request without Authorization header"
      - post:
          url: "/products"
          json:
            id: "{{ id }}"
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          expect: 
            - statusCode: 401
            - hasProperty: "error"
      - think: 1
